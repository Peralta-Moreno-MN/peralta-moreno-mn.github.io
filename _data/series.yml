# ---------------------------------------------------------------
#  SCIENTIFIC STORIES — series of blog posts, each with its own illustrator.
#  A post belongs to a series with, in its front matter:
#     categories: [stories]
#     series: from-leaf-to-lead
# ---------------------------------------------------------------

rare-diseases:
  title: Rare but Real
  tagline: Giving visibility to rare diseases and the science fighting them.
  description: >-
    A rare disease affects only a few people, but together they affect millions.
    Stories about rare diseases, the people living with them, and the research
    working towards better diagnoses and treatments.
  illustrator:                           # ✏️ name (leave empty to hide the credit)
  illustrator_link:
  style: Illustrations
  cover: /assets/img/stories/rare-diseases/cover.jpg

from-leaf-to-lead:
  title: From Leaf to Lead
  tagline: Natural medicinal plants and the molecules behind them.
  description: >-
    From traditional remedies to modern medicines: the stories of medicinal plants,
    the active molecules hidden in their leaves, roots and flowers, and how they
    inspire the design of new drugs.
  illustrator:                           # ✏️ name (leave empty to hide the credit)
  illustrator_link:
  style: Scrapbook illustrations
  cover: /assets/img/stories/from-leaf-to-lead/cover.jpg

women-in-drug-design:
  title: Women in Drug Design
  tagline: The women behind the medicines we use every day.
  description: >-
    Portraits of the women who shaped, and keep shaping, drug discovery and design:
    their science, their paths, and why you should know their names.
  illustrator: Atelier Sianna
  illustrator_link: https://www.instagram.com/atelier.sianna
  style: Illustrated portraits
  cover: /assets/img/stories/women-in-drug-design/cover.jpg

structure-function:
  title: From Structure to Function (and Back)
  tagline: How a protein's shape tells us what it does, and how we design shapes to do new things.
  description: >-
    Proteins are tiny machines, and their shape is the key to how they work.
    Stories that go from structure to function, understanding what a protein does by
    looking at its 3D shape, and back again, designing structures to achieve new functions.
  illustrator:
  illustrator_link:
  style: Illustrations
  cover: /assets/img/stories/structure-function/cover.jpg

paths-in-science:
  title: We Make the Path by Walking
  tagline: The human side of a scientific career.
  description: >-
    "Traveller, there is no path; the path is made by walking", wrote Antonio Machado.
    Science is also made of decisions, moves, doubts and small victories. Personal
    experiences, mine and those of colleagues, practical tips on grants and opportunities,
    and some encouragement for everyone building their own path in science.
  illustrator:
  illustrator_link:
  style: Photos
  cover: /assets/img/stories/paths-in-science/cover.jpg
